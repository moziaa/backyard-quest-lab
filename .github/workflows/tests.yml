name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test mission constraints and CLI
        run: python -m unittest -v
      - name: Check printable mission cards
        run: python quest_lab.py --materials paper blocks --minutes 30 --space table
      - name: Check JSON example
        run: python quest_lab.py --materials paper --minutes 10 --space floor --adult --json
